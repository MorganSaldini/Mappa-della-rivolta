# Copia di riserva della mappa.
# Ogni mezz'ora scarica l'elenco degli eventi dal sito e lo salva in public/dati/eventi.json.
# Se un giorno il sito è troppo visitato e il "motore" non risponde, la pagina mostra questa copia
# (i file statici su Cloudflare sono gratuiti e senza limiti di visite).
# Salva solo se gli eventi sono cambiati, così Cloudflare non rifà il sito per niente.
name: Copia di riserva degli eventi

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # per far partire gli "Specchi della mappa" quando gli eventi cambiano

concurrency:
  group: copia-eventi
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scarica gli eventi dal sito
        id: scarica
        run: |
          set -u
          # Indirizzo workers.dev: non passa dalle protezioni anti-bot del dominio principale
          URL="https://mappadellarivolta.morgansaldini.workers.dev/api/mobilitazioni"
          if ! curl -sSf --max-time 30 -H 'accept: application/json' "$URL" -o nuovo.json; then
            echo "Il sito non ha risposto: tengo la copia precedente."
            echo "cambiato=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! jq -e '.ok == true and (.eventi | type == "array")' nuovo.json > /dev/null; then
            echo "Risposta non valida: tengo la copia precedente."
            echo "cambiato=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILE=public/dati/eventi.json
          PRIMA=$(jq -S -c '.eventi // []' "$FILE" 2>/dev/null || echo '[]')
          DOPO=$(jq -S -c '.eventi' nuovo.json)
          if [ "$PRIMA" = "$DOPO" ]; then
            echo "Nessun cambiamento negli eventi."
            echo "cambiato=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq --arg ora "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'del(.generato_il) + {copia_del: $ora}' nuovo.json > "$FILE"
          echo "Eventi nella copia: $(jq '.eventi | length' "$FILE")"
          echo "cambiato=si" >> "$GITHUB_OUTPUT"

      - name: Salva la copia nel repository
        id: salva
        if: steps.scarica.outputs.cambiato == 'si'
        run: |
          git config user.name "copia-di-riserva"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dati/eventi.json
          git commit -m "Copia di riserva degli eventi"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then echo "salvato=si" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 10
          done
          echo "Non riesco a salvare la copia (riprovo al prossimo giro)."

      - name: Aggiorna gli specchi (GitHub Pages, Codeberg, Nostr)
        if: steps.scarica.outputs.cambiato == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run specchi.yml --ref main || echo "Specchi non avviati, riprovo al prossimo cambiamento."
