<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Area moderatori · Mappa delle mobilitazioni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="modera.css?v=6">
</head>
<body>
  <header class="barra">
    <a class="barra__nome" href="./" style="color:#fff;text-decoration:none">← Mappa</a>
    <span id="chi" class="barra__chi"></span>
  </header>

  <main class="mod">
    <!-- Accesso -->
    <section id="vista-accesso" class="mod-accesso" hidden>
      <h1>Area moderatori</h1>
      <p>Inserisci il tuo codice personale. Te lo ha dato l'amministratore del sito: non condividerlo con nessuno.</p>
      <form id="form-accesso" class="mod-accesso__form">
        <label for="codice">Codice</label>
        <input id="codice" name="codice" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" required>
        <button class="bottone bottone--pieno" type="submit">Entra</button>
      </form>
      <p class="dlg__errore" id="errore-accesso" role="alert"></p>
    </section>

    <!-- Pannello -->
    <section id="vista-pannello" hidden>
      <nav class="schede" role="tablist" aria-label="Sezioni">
        <button role="tab" data-scheda="nuovi" aria-selected="true">Da controllare <b id="n-nuovi">0</b></button>
        <button role="tab" data-scheda="modifiche">Correzioni <b id="n-modifiche">0</b></button>
        <button role="tab" data-scheda="problemi">Segnalazioni <b id="n-problemi">0</b></button>
        <button role="tab" data-scheda="tutti">Tutti gli eventi</button>
        <button role="tab" data-scheda="staff" class="solo-admin" hidden>Moderatori</button>
        <button role="tab" data-scheda="impostazioni" class="solo-admin" hidden>Impostazioni</button>
      </nav>

      <div class="barra-agente" id="barra-agente">
        <button type="button" class="bottone bottone--chiaro" id="importa-agente">🤖 Importa ora le proposte dell’agente</button>
        <span class="tenue" id="esito-agente">L’agente cerca mobilitazioni annunciate da fonti pubbliche; il sito le importa ogni notte come “Da verificare”.</span>
      </div>
      <div class="scheda" id="scheda-nuovi"></div>
      <div class="scheda" id="scheda-modifiche" hidden></div>
      <div class="scheda" id="scheda-problemi" hidden></div>
      <div class="scheda" id="scheda-tutti" hidden>
        <form id="form-cerca-mod" class="mod-filtri">
          <input name="q" placeholder="Cerca per titolo, comune o codice evento">
          <select name="stato">
            <option value="">Tutti gli stati</option>
            <option value="da_verificare">Da verificare</option>
            <option value="verificato">Verificati</option>
            <option value="annullato">Annullati</option>
            <option value="nascosto">Nascosti</option>
            <option value="rifiutato">Rifiutati</option>
          </select>
          <button class="bottone" type="submit">Cerca</button>
        </form>
        <div id="elenco-tutti"></div>
      </div>
      <div class="scheda" id="scheda-staff" hidden></div>
      <div class="scheda" id="scheda-impostazioni" hidden></div>
    </section>
  </main>

  <!-- Modifica diretta -->
  <dialog id="dlg-modifica" aria-labelledby="titolo-modifica">
    <form id="form-modifica" method="dialog" novalidate>
      <div class="dlg__testa">
        <h2 id="titolo-modifica">Modifica evento</h2>
        <button type="button" class="dlg__chiudi" data-chiudi aria-label="Chiudi">✕</button>
      </div>
      <label>Tipo<select name="tipo"></select></label>
      <label>Titolo<input name="titolo" maxlength="120"></label>
      <div class="riga">
        <label>Data<input name="data" type="date"></label>
        <label>Inizio<input name="ora_inizio" type="time"></label>
        <label>Fine<input name="ora_fine" type="time"></label>
      </div>
      <div class="riga">
        <label class="cresci">Comune<input name="comune" maxlength="80"></label>
        <label class="corto">Prov.<input name="provincia" maxlength="2"></label>
      </div>
      <label>Regione<select name="regione"></select></label>
      <label>Luogo<input name="luogo" maxlength="120"></label>
      <div class="riga">
        <label>Latitudine<input name="lat" inputmode="decimal"></label>
        <label>Longitudine<input name="lng" inputmode="decimal"></label>
      </div>
      <label class="spunta"><input type="checkbox" name="posizione_approssimativa"> Posizione indicativa</label>
      <label>Organizzatori (sigle, separate da virgola)<input name="organizzatori" maxlength="300"></label>
      <label>Fonte<input name="fonte" type="url" maxlength="300"></label>
      <p class="dlg__errore" id="errore-modifica" role="alert"></p>
      <div class="dlg__azioni">
        <button type="button" class="bottone bottone--chiaro" data-chiudi>Annulla</button>
        <button type="submit" class="bottone bottone--pieno">Salva modifica</button>
      </div>
    </form>
  </dialog>

  <!-- Cronologia -->
  <dialog id="dlg-cronologia" aria-labelledby="titolo-cronologia">
    <div class="dlg__contenuto">
      <div class="dlg__testa">
        <h2 id="titolo-cronologia">Cronologia</h2>
        <button type="button" class="dlg__chiudi" data-chiudi aria-label="Chiudi">✕</button>
      </div>
      <div id="voci-cronologia"></div>
    </div>
  </dialog>

  <div class="avviso-ok" id="avviso-ok" role="status" hidden></div>
  <script src="modera.js?v=6"></script>
</body>
</html>
