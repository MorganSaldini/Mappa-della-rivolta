# Configurazione Cloudflare Worker (con i file della pagina in "public")
name = "mappadellarivolta"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# Mantiene attivo anche l’indirizzo …workers.dev
workers_dev = true

# Dominio del sito (Cloudflare crea da solo i record DNS e il certificato)
routes = [
  { pattern = "mappadellarivolta.org", custom_domain = true },
  { pattern = "www.mappadellarivolta.org", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Le richieste /api/... passano dal codice; le altre sono servite direttamente come file
run_worker_first = ["/api/*"]

# Ogni 3 ore: importa le proposte dell’agente e cancella gli eventi vecchi
[triggers]
crons = ["15 */3 * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "mobilitazioni"
# Sostituisci con l'ID del tuo database (Cloudflare > Storage & Databases > D1 > mobilitazioni)
database_id = "40bbeabf-0b14-4f50-b230-b85eec13ab3e"
